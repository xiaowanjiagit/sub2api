name: Custom GHCR Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag
        required: true
        default: custom-0.2.7.1
        type: string
      version:
        description: Application version embedded in the image
        required: true
        default: 0.2.7-custom.1
        type: string
      platforms:
        description: Target platforms
        required: true
        default: linux/amd64,linux/arm64
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sub2api:${{ inputs.image_tag }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
