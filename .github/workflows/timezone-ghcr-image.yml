name: Timezone GHCR Image

on:
  push:
    branches:
      - codex/timezone-release
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: timezone-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/xiaowanjiagit/sub2api
      IMAGE_VERSION: 0.2.17-timezone.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE }}:timezone-${{ github.sha }}
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=timezone-image
          cache-to: type=gha,scope=timezone-image,mode=max

      - name: Verify published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$IMAGE_DIGEST"
          docker run --rm --platform linux/amd64 --entrypoint /app/sub2api "$IMAGE@$IMAGE_DIGEST" -version
          printf 'Image: `%s:%s`\n\nDigest: `%s`\n' "$IMAGE" "$IMAGE_VERSION" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
